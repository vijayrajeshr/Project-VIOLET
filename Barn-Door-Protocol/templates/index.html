<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIOLET SYSTEM ONLINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --accent: #b142ff;
            --accent-glow: rgba(177, 66, 255, 0.5);
            --panel-bg: rgba(25, 25, 35, 0.6);
            --text-main: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism background effect */
        .ambient-light {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(5,5,16,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Header / Status */
        .header {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sys-title {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .metrics {
            display: flex;
            gap: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .metric span { color: var(--accent); }

        /* Main Chat Area */
        .chat-container {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 70%;
            padding: 15px 25px;
            border-radius: 15px;
            line-height: 1.5;
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            background: rgba(255, 255, 255, 0.05);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-violet {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(177, 66, 255, 0.2);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Input Area */
        .input-area {
            padding: 20px 40px;
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            flex-grow: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(177, 66, 255, 0.2);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #c56eff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Loading Indicator */
        .thinking {
            display: none;
            align-self: flex-start;
            gap: 5px;
            padding: 15px 25px;
            background: transparent;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>
    <div class="ambient-light"></div>

    <div class="header">
        <div class="sys-title">
            VIOLET Core // Engine: 
            <select id="model-select" onchange="changeModel()" style="background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 5px; border-radius: 5px; font-family: 'Inter', sans-serif; outline: none; cursor: pointer;">
                {% for model in available_models %}
                    <option value="{{ model }}" {% if model == model_name %}selected{% endif %} style="background: #1a1a24; color: #fff;">{{ model }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="metrics">
            <div class="metric">CPU: <span id="cpu">--%</span></div>
            <div class="metric">RAM: <span id="ram">--%</span></div>
        </div>
    </div>

    <div class="chat-container" id="chat-box">
        <div class="message msg-violet">System Online. Awaiting your directives, Vijay.</div>
        
        <div class="thinking" id="thinking-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Enter command, Sir..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">EXECUTE</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const thinkingIndicator = document.getElementById('thinking-indicator');

        // Allow 'Enter' key to send message
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'msg-user' : 'msg-violet'}`;
            // Basic markdown handling for code blocks
            let formattedText = text.replace(/```([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,0.5);padding:10px;border-radius:5px;overflow-x:auto;">$1</pre>');
            div.innerHTML = formattedText;
            
            // Insert before thinking indicator
            chatBox.insertBefore(div, thinkingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function changeModel() {
            const select = document.getElementById('model-select');
            const modelName = select.value;
            
            try {
                const formData = new FormData();
                formData.append('model_name', modelName);
                
                const response = await fetch('/set_model', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    appendMessage(`<span style="color:var(--accent)">System Alert: Engine switched to ${modelName}.</span>`, false);
                } else {
                    appendMessage(`<span style="color:#ff4444">Error switching engine: ${data.message}</span>`, false);
                }
            } catch (error) {
                appendMessage(`<span style="color:#ff4444">Failed to connect to server.</span>`, false);
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = '';
            
            // Show thinking
            thinkingIndicator.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const formData = new FormData();
                formData.append('message', text);

                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                thinkingIndicator.style.display = 'none';
                
                if (data.status === 'success') {
                    appendMessage(data.response, false);
                } else {
                    appendMessage(`<span style="color:#ff4444">Error: ${data.response}</span>`, false);
                }
            } catch (error) {
                thinkingIndicator.style.display = 'none';
                appendMessage(`<span style="color:#ff4444">Connection Failed.</span>`, false);
            }
        }

        // Poll system status every 2 seconds
        setInterval(async () => {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                document.getElementById('cpu').innerText = data.cpu;
                document.getElementById('ram').innerText = data.ram;
            } catch (e) {}
        }, 2000);
    </script>
</body>
</html>
